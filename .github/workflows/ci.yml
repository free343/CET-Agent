name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check app scripts tests main.py

      - name: Format
        run: python -m ruff format --check app scripts tests main.py

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q

      - name: Offscreen startup smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python main.py --smoke-test
