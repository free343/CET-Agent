name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Ruff
        run: python -m ruff check app scripts tests main.py

      - name: Format
        run: python -m ruff format --check app scripts tests main.py

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q

      - name: Offscreen startup smoke
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python main.py --smoke-test

      - name: Build Windows release
        if: matrix.python-version == '3.13'
        run: python -m PyInstaller --noconfirm --clean packaging/CET-Agent.spec

      - name: Packaged startup and writable-path smoke
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "cet-agent-packaged-runtime"
          $env:LOCALAPPDATA = $runtimeRoot
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process `
            -FilePath "dist/CET-Agent/CET-Agent.exe" `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $appData = Join-Path $runtimeRoot "CET-Agent"
          if (-not (Test-Path (Join-Path $appData "data/cet_agent.db"))) { exit 1 }
          if (-not (Test-Path (Join-Path $appData "logs/cet-agent.log"))) { exit 1 }
          if (-not (Test-Path (Join-Path $appData ".env.example"))) { exit 1 }
